site_name: Foodify — Sprint 2 Team Handbook
site_description: شرح فرق الفرونت والباك والربط والنشر والاختبارات في Foodify
docs_dir: docs/teams
site_dir: site
use_directory_urls: false
theme:
  name: mkdocs
  locale: ar
nav:
  - ابدأ هنا: index.md
  - تيم Frontend: frontend.md
  - Backend Team — English: backend.md
  - تيم Integration: integration.md
  - تيم Deployment: deployment.md
  - Unit وIntegration Tests: testing.md
  - كل حالات الاختبار: test-catalog.md
  - أدوات التوثيق: documentation.md
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
extra_css:
  - assets/handbook.css
extra_javascript:
  - assets/language.js
validation:
  links:
    unrecognized_links: warn
    anchors: warn
