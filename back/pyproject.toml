[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "foodify-api"
version = "0.1.0"
description = "Foodify customer identity API built with FastAPI and SQLAlchemy"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.core" = ["swagger_ui.js"]
"app.ordering" = ["data/*.json"]

[tool.fastapi]
entrypoint = "app.hosted:app"

[tool.ruff]
target-version = "py312"
line-length = 100
