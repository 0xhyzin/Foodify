[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "foodify-api"
version = "0.1.0"
description = "Foodify customer identity API built with FastAPI and SQLAlchemy"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic[email]>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "SQLAlchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2.0",
    "PyMySQL[rsa]>=1.1,<2.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "cryptography>=44.0,<47.0",
    "redis>=5.2,<8.0",
    "httpx>=0.28,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.core" = ["swagger_ui.js"]
"app.ordering" = ["data/*.json"]

[tool.fastapi]
entrypoint = "app.hosted:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: isolated functions or adapters with fake dependencies; no HTTP application or database",
    "integration: FastAPI routes, services and SQLAlchemy repositories with an in-memory database",
]
