# FastAPI, MySQL, Redis and the email worker. React is independent on Vercel.
# Starter instances are PAID. Review current Render pricing before creating them.
# MySQL data lives on a persistent disk. Datastores have private networking only.
services:
  - type: pserv
    name: foodify-mysql
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    dockerfilePath: ./deploy/mysql/Dockerfile
    dockerContext: ./deploy/mysql
    autoDeployTrigger: off
    disk:
      name: foodify-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: foodify
      - key: MYSQL_USER
        value: foodify
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_MIGRATION_PASSWORD
        generateValue: true
  - type: pserv
    name: foodify-redis
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    dockerfilePath: ./deploy/redis/Dockerfile
    dockerContext: ./deploy/redis
    autoDeployTrigger: off
    envVars:
      - key: REDIS_PASSWORD
        generateValue: true
  - type: web
    name: foodify-api
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    dockerfilePath: ./back/Dockerfile
    dockerContext: ./back
    dockerCommand: python run.py --env production --host 0.0.0.0
    preDeployCommand: python -m scripts.release
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DOCS_ENABLED
        value: "false"
      - key: WORKERS
        value: "1"
      - key: DATABASE_POOL_SIZE
        value: "3"
      - key: DATABASE_MAX_OVERFLOW
        value: "2"
      - key: MYSQL_HOST
        fromService: { type: pserv, name: foodify-mysql, property: host }
      - key: MYSQL_PASSWORD
        fromService: { type: pserv, name: foodify-mysql, envVarKey: MYSQL_PASSWORD }
      - key: MYSQL_MIGRATION_PASSWORD
        fromService: { type: pserv, name: foodify-mysql, envVarKey: MYSQL_MIGRATION_PASSWORD }
      - key: REDIS_HOST
        fromService: { type: pserv, name: foodify-redis, property: host }
      - key: REDIS_PASSWORD
        fromService: { type: pserv, name: foodify-redis, envVarKey: REDIS_PASSWORD }
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_PROXY_SECRET
        sync: false
      - key: JWT_ISSUER
        value: foodify-api-production
      - key: JWT_AUDIENCE
        value: foodify-client-production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: BROWSER_COOKIE_SAME_SITE
        value: lax
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
  - type: worker
    name: foodify-email-worker
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    dockerfilePath: ./back/Dockerfile
    dockerContext: ./back
    dockerCommand: python -m app.worker
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DOCS_ENABLED
        value: "false"
      - key: DATABASE_POOL_SIZE
        value: "1"
      - key: DATABASE_MAX_OVERFLOW
        value: "0"
      - key: MYSQL_HOST
        fromService: { type: pserv, name: foodify-mysql, property: host }
      - key: MYSQL_PASSWORD
        fromService: { type: pserv, name: foodify-mysql, envVarKey: MYSQL_PASSWORD }
      - key: REDIS_HOST
        fromService: { type: pserv, name: foodify-redis, property: host }
      - key: REDIS_PASSWORD
        fromService: { type: pserv, name: foodify-redis, envVarKey: REDIS_PASSWORD }
      - key: JWT_SECRET
        fromService: { type: web, name: foodify-api, envVarKey: JWT_SECRET }
      - key: EMAIL_ENCRYPTION_KEY
        fromService: { type: web, name: foodify-api, envVarKey: EMAIL_ENCRYPTION_KEY }
      - key: JWT_ISSUER
        value: foodify-api-production
      - key: JWT_AUDIENCE
        value: foodify-client-production
      - key: PUBLIC_BASE_URL
        fromService: { type: web, name: foodify-api, envVarKey: PUBLIC_BASE_URL }
      - key: FRONTEND_URL
        fromService: { type: web, name: foodify-api, envVarKey: FRONTEND_URL }
      - key: CORS_ORIGINS
        fromService: { type: web, name: foodify-api, envVarKey: CORS_ORIGINS }
      - key: TRUSTED_HOSTS
        fromService: { type: web, name: foodify-api, envVarKey: TRUSTED_HOSTS }
      - key: SMTP_HOST
        fromService: { type: web, name: foodify-api, envVarKey: SMTP_HOST }
      - key: SMTP_PORT
        fromService: { type: web, name: foodify-api, envVarKey: SMTP_PORT }
      - key: SMTP_USERNAME
        fromService: { type: web, name: foodify-api, envVarKey: SMTP_USERNAME }
      - key: SMTP_PASSWORD
        fromService: { type: web, name: foodify-api, envVarKey: SMTP_PASSWORD }
      - key: SMTP_FROM_EMAIL
        fromService: { type: web, name: foodify-api, envVarKey: SMTP_FROM_EMAIL }
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
