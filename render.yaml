# Free web service. MySQL and Redis-compatible Valkey use Aiven's free plans.
# Brevo HTTPS replaces SMTP because Render Free blocks common SMTP ports.
services:
  - type: web
    name: foodify-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./back/Dockerfile
    dockerContext: ./back
    dockerCommand: python -m scripts.hosted_start
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DOCS_ENABLED
        value: "false"
      - key: WORKERS
        value: "1"
      - key: DATABASE_POOL_SIZE
        value: "2"
      - key: DATABASE_MAX_OVERFLOW
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: DATABASE_TLS_REQUIRED
        value: "true"
      - key: DATABASE_SSL_CA_PEM
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_PROXY_SECRET
        sync: false
      - key: JWT_ISSUER
        value: foodify-api-production
      - key: JWT_AUDIENCE
        value: foodify-client-production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://foodify-flax.vercel.app
      - key: CORS_ORIGINS
        value: '["https://foodify-flax.vercel.app"]'
      - key: TRUSTED_HOSTS
        sync: false
      - key: BROWSER_COOKIE_SAME_SITE
        value: lax
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMBEDDED_EMAIL_WORKER
        value: "true"
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
