name: Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm --prefix front ci
      - run: npm test
      - run: npm run build
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            back/requirements.lock.txt
            back/requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q
      - run: python -m pip install -r ../requirements-docs.txt
      - run: python scripts/export_openapi.py
        working-directory: .
      - run: python -m mkdocs build --strict
        working-directory: .
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m compileall -q back/app back/scripts back/migrations
